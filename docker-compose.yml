# Rotación de logs de Docker. Sin esto, el json-file de cada contenedor crece
# sin límite (Postgres y Caddy escriben mucho) y es de las cosas que más disco
# se comen en un VPS sin que se vea en ningún sitio.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  db:
    <<: *logging
    image: postgres:16-alpine
    restart: unless-stopped
    # Ajustes para un VPS de 1,8 GB: los valores de fábrica de PostgreSQL están
    # pensados para una máquina mucho más grande. max_connections=100 con el
    # work_mem de cada una es lo que convierte un pico en un OOM; la app usa un
    # pool de 10 y el túnel del CRM un par más, así que 20 sobra.
    command: >
      postgres
      -c max_connections=20
      -c shared_buffers=192MB
      -c effective_cache_size=640MB
      -c work_mem=6MB
      -c maintenance_work_mem=128MB
    # Techo de memoria: sin él, si algo se desmadra el núcleo elige víctima al
    # azar y puede llevarse la base de datos por delante. Con techo, el que se
    # pasa es el que cae, y docker lo reinicia.
    mem_limit: 640m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Publica Postgres SOLO en el loopback del VPS (no accesible desde internet):
    # permite que el panel de administración local llegue a la BD a través de un
    # túnel SSH (ssh -L). Sin este mapeo, la BD solo es visible dentro de Docker.
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    <<: *logging
    mem_limit: 512m
    build:
      context: .
      args:
        # Dominio público en tiempo de build (canonical/sitemap/OpenGraph).
        SITE_URL: ${SITE_URL}
    restart: unless-stopped
    # Carga las claves (TMDB/OMDb/auth/OAuth) desde .env. Nunca se versiona.
    env_file: .env
    environment:
      # La URL de la BD se compone aquí y tiene prioridad sobre cualquier valor de .env.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    # Sonda propia de la app (/api/health comprueba que PostgreSQL responde).
    # Node 22 trae fetch incorporado, así que no hace falta curl en la imagen.
    # start_period cubre el arranque: migraciones + primer render.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4321/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    expose:
      - '4321'

  caddy:
    <<: *logging
    mem_limit: 96m
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
      EMAIL: ${EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  db-data:
  caddy-data:
  caddy-config:
